name: Moodle Plugin CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_USER: root
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        # version.php declares $plugin->supported = [39, 502], i.e. Moodle 3.9 through 5.2.
        # One PHP version per branch, chosen as the highest PHP release that branch supports
        # per https://moodledev.io/general/development/policies/php, alternating database
        # engines to get coverage of both without a full cross-product across every branch.
        include:
          - php: '7.4'
            moodle-branch: 'MOODLE_39_STABLE'
            database: pgsql
          - php: '8.0'
            moodle-branch: 'MOODLE_400_STABLE'
            database: mariadb
          - php: '8.1'
            moodle-branch: 'MOODLE_401_STABLE'
            database: pgsql
          - php: '8.1'
            moodle-branch: 'MOODLE_402_STABLE'
            database: mariadb
          - php: '8.2'
            moodle-branch: 'MOODLE_403_STABLE'
            database: pgsql
          - php: '8.2'
            moodle-branch: 'MOODLE_404_STABLE'
            database: mariadb
          - php: '8.3'
            moodle-branch: 'MOODLE_405_STABLE'
            database: pgsql
          - php: '8.3'
            moodle-branch: 'MOODLE_500_STABLE'
            database: mariadb
          - php: '8.3'
            moodle-branch: 'MOODLE_501_STABLE'
            database: pgsql
          - php: '8.3'
            moodle-branch: 'MOODLE_502_STABLE'
            database: mariadb

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.database == 'pgsql' && 'pgsql' || 'mysqli' }}, zip, gd
          tools: phpunit
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci && pwd)/bin >> $GITHUB_PATH
          echo $(cd ci && pwd)/vendor/bin >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
        env:
          COMPOSER_NO_INTERACTION: 1

      - name: Install Moodle
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validate
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning
